<title>Museo di Fisica – Schede degli strumenti</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mu:#6b6a63;--ac:#8a2a2a;--bd:#e3dfd5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16150f;--card:#201f18;--tx:#eeebe0;--mu:#a09d8f;--ac:#e08a7a;--bd:#34322a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16150f;--card:#201f18;--tx:#eeebe0;--mu:#a09d8f;--ac:#e08a7a;--bd:#34322a}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
.w{max-width:720px;margin:auto;padding:18px 16px 40px}
.k{color:var(--mu);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:1.6rem;margin:2px 0 14px}h2{font-size:1rem;margin:18px 0 4px;color:var(--ac)}
.v{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-top:14px}
.f{font-family:Georgia,serif;background:var(--bg);border-radius:8px;padding:6px 10px;margin:6px 0;overflow-x:auto}
.b{display:inline-block;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:999px;margin:10px 8px 0 0;background:var(--ac);color:#fff;border:0;font:inherit;font-weight:700;cursor:pointer}.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.it{display:flex;justify-content:space-between;text-decoration:none;color:var(--tx);padding:16px;margin-top:10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-weight:600}.it span{color:var(--mu);font-weight:400}
.m{color:var(--mu);font-size:.85rem}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}.qc{text-align:center;padding:10px;background:#fff;color:#000;border-radius:10px;border:1px solid var(--bd);font-size:.85rem}.qc img,.qc canvas{margin:auto}
input{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
@media print{.np{display:none!important}}
</style>

<script>
var GH="https://giulianaa-teacher.github.io/museodifisicaclassico/";
var MV="https://sites.google.com/liceoclassicope.edu.it/esperienze-di-fisica-simulator/settembre-2026";
var X=[
{n:25,t:"Baroscopio",v:"_tPPtjGCO6s",sim:"Baroscopio%20nella%20campana%20a%20vuoto.html",
 m:"Collezione: meccanica · Sezione: meccanica dei gas · Misure: altezza 19,00 cm, larghezza 3,50 cm · Materiali: vetro, metallo, polistirolo · Condizioni: ottime",
 s:[["Descrizione","Il baroscopio è una bilancia a due bracci: da un lato è presente una sfera voluminosa di un materiale leggero, dall’altro un contrappeso che la porta in equilibrio. È inoltre presente una scala graduata che permette di individuare spostamenti anche molto piccoli."],["Funzione","Il baroscopio dimostra il principio di Archimede: al variare della pressione varia la densità dell’aria e di conseguenza anche la spinta di Archimede sull’intera apparecchiatura."],["Modalità d’uso","Si pone il baroscopio sotto una campana di vetro con una pompa a vuoto e si aspira l’aria. In assenza di aria la sfera, con un volume maggiore, si avvicina al piano d’appoggio."]],
 f:"<div class='f'>F<sub>spinta</sub> = ρ<sub>aria</sub> · V · g</div><div class='f'>ρ = p · M / (R · T)</div>Meno aria = ρ più piccola = spinta minore, soprattutto sul corpo di volume maggiore (la sfera)."},
{n:22,t:"Trottola inerziale di Maxwell",v:"8FOoXsctoL8",sim:"simulazione_ruota_di_maxwell%20(1).html",
 m:"Collezione: fisica · Sezione: meccanica · Costruttore e data: non indicati · Materiali: metallo · Misure: medie · Stato: ottimo",
 s:[["Descrizione","Su una base rettangolare di metallo con quattro piedini di gomma è fissato un telaio metallico rettangolare su cui è sospeso un piccolo disco d’acciaio. Il disco è sospeso mediante due fili, paralleli e di uguale lunghezza, attaccati alle estremità dell’asse del disco. I fili possono essere avvolti nello stesso verso sull’asse. Lasciando libero il disco ad una certa altezza, i fili si srotolano ed esso acquista energia cinetica, sia di traslazione verso il basso che di rotazione intorno all’asse. Quando i fili sono svolti completamente, cominciano a riavvolgersi in senso opposto ed il disco sale, trasformando l’energia cinetica in energia potenziale."],["Funzione","È praticamente uno yo-yo di grandi dimensioni e serve per dimostrare l’inerzia di moto ed il principio di conservazione dell’energia. A differenza dello yo-yo, il disco è sorretto da due fili fissati al suo asse. Il fenomeno si ripete più volte fino all’arresto per effetto degli attriti."],["Energia","Se il disco cade dall’altezza S, la perdita di energia potenziale è m·g·S. Questa energia diventa energia cinetica di rotazione, ½Iω², e di traslazione, ½mv²."]],
 f:"<div class='f'>m g S = ½ m v² + ½ I ω² &nbsp;, &nbsp; ω = v / r</div><div class='f'>a = g / (1 + I / (m r²))</div>Più la rotazione assorbe energia, più la discesa è lenta."},
{n:55,t:"Anello di Gravesande",v:"21NG_iLOIi0",sim:"anello_di_gravesande_simulazione.html",
 m:"Collezione: fisica · Sezione: termodinamica · Misure: 25 cm × 15 cm · Materiali: ottone, ferro · Stato: buono",
 s:[["Descrizione","È costituito da un’asta verticale cui è appesa una sfera in ottone. Alla stessa asta è fissato, con un sistema a scorrimento, un anello anch’esso in ottone. Sotto l’anello è fissato un fornelletto munito di stoppino. Il diametro dell’anello è giusto sufficiente per permettere il passaggio della sfera a temperatura ambiente."],["Funzione","Veniva utilizzato per mostrare la dilatazione termica dei solidi."],["Modalità d’uso","La differenza tra il diametro della sfera e quello dell’anello è così piccola che la sfera passa in condizioni normali, ma non quando è surriscaldata: ciò dimostra l’aumento di volume sotto l’effetto del calore."]],
 f:"<div class='f'>D = D₀ (1 + α ΔT)</div><div class='f'>ΔV / V ≈ 3 α ΔT</div>Il blocco avviene quando D supera il diametro dell’anello."},
{n:62,t:"Apparecchio di Ingenhousz",v:"XXP3hI3M2Zs",sim:"apparecchio_di_ingen_housz_interattivo.html",
 m:"Costruttore: J. Ingenhousz · Luogo: Olanda · Data: 1878 · Collezione: fisica · Sezione: termodinamica · Base 34,3 × 21,2 cm, altezza 17,8 cm · Bacchette Ø 0,7 cm, L 10 cm · Condizioni: buone",
 s:[["Descrizione","Otto barrette di materiale diverso, di uguale sezione e lunghezza, sono fissate a una parete esterna di una sottile scatola metallica cava, in modo da penetrare per qualche centimetro all’interno. Dalla parte opposta la cassetta ha un’impugnatura in legno."],["Funzione","Serve per dimostrare la diversa conducibilità termica dei materiali. Le barre di alluminio, ferro, legno, rame, ottone e acciaio sono montate sul coperchio di un recipiente di alluminio contenente acqua."],["Modalità d’uso","Si ricoprono le barrette con un sottile strato di cera, che fonde a circa 60 °C, e si riempie la cassetta con acqua bollente. Il calore si propaga e la cera fonde per tratti di lunghezza diversa: confrontandoli si confrontano le conducibilità. Ponendo uguale a 100 la conducibilità dell’argento si ottengono valori relativi per le altre sostanze."]],
 f:"<div class='f'>q = − k · A · dT/dx &nbsp; (legge di Fourier)</div><div class='f'>x<sub>fusione</sub> ≈ 2ξ √(D t) &nbsp;, &nbsp; D = k / (ρ c)</div>Più k e D sono grandi, più lontano arriva la cera fusa nello stesso tempo."},
{n:66,t:"Cubo di Leslie",v:"pssO-H22lD4",sim:"leslie_cube_simulation%20(1).html",
 m:"Costruttore: Friederich Leybold · Germania · XIX/XX secolo · Inventario scolastico n. 752 · Sezione: termodinamica · Materiali: metallo, vernice · Misure: 10–15 cm per lato · Stato: ottimo",
 s:[["Descrizione","Apparecchio di forma cubica, cavo all’interno, in metallo conduttore, con un coperchio superiore con innesto per termometro. Le quattro facce laterali hanno finiture diverse: nero opaco, grigio opaco, bianco e metallo riflettente."],["Funzione","Mostra come l’irraggiamento termico dipenda dalla natura della superficie, a parità di temperatura."],["Modalità d’uso","Il cubo si riempie di acqua bollente, così le quattro pareti raggiungono la stessa temperatura. Si pone poi una termopila (o un sensore a infrarossi) a distanza fissa da ciascuna faccia. La faccia nera irradia di più, in accordo con la legge di Kirchhoff e con quella di Stefan–Boltzmann; la faccia lucida irradia di meno: i buoni riflettori sono pessimi emettitori."]],
 f:"<div class='f'>M = ε σ (T⁴ − T₀⁴) &nbsp; (σ = 5,67·10⁻⁸ W/m²K⁴)</div><div class='f'>E = M · A / (π d²)</div>ε vale circa 0,95 per il nero opaco e 0,05 per il metallo lucido."}
,
{n:20,t:"Termoscopio doppio di Looser",v:"",sim:"laboratorio_termoscopio_di_looser%20(1).html",
 m:"Costruttore: Leybold · Trieste · 1940 · Collezione: fisica · Sezione: meccanica · Misure: altezza 20–30 cm, larghezza 10–15 cm, lunghezza 15–20 cm · Materiali: vetro, ferro, gomma · Condizioni: buone",
 s:[["Descrizione","Due manometri ad aria libera uguali, montati sulla stessa tavoletta, con in mezzo una scala graduata in mezzi centimetri. I rami corti ed esterni terminano con due bulbi che fanno da pozzetto al liquido colorato e ne assicurano un riferimento iniziale praticamente costante. Sono chiusi da chiavette di vetro a tenuta e hanno portagomma laterali per gli accessori."],["Funzione","Strumento storico da laboratorio per evidenziare minime variazioni di temperatura e passaggi di calore."],["Modalità d’uso","Si riempiono i due tubi con liquido rosso dalle aperture superiori ed è possibile eseguire esperienze di dilatazione dei corpi, conduzione del calore, calore nei passaggi di stato e nelle reazioni chimiche."]],
 f:"<div class='f'>ΔV = β V₀ ΔT</div><div class='f'>Δp = ρ g Δh</div>Il riscaldamento dell’aria dilata il gas e sposta il liquido: il dislivello Δh misura la variazione di temperatura."},
{n:2,t:"Bobina a corrente elevata da 5 spire",v:"",sim:"simulazione_bobina_a_corrente_elevata.html",
 m:"Costruttore: E. Leybold’s Nachfolger · ca. 1959 · Collezione: fisica · Sezione: elettricità · Altezza 34 cm, larghezza 7,5 cm, lunghezza 9 cm · Materiali: rame, metallo, legno · Stato: buono",
 s:[["Descrizione","Grosso filo di rame (8 mm di spessore) avvolto in 5 spire di circa 65 mm di diametro, rivestite internamente da un manicotto isolante. Le estremità hanno manici in legno e, sopra i manici, morsetti in cui sono fissati dei chiodi per chiudere il circuito."],["Funzione","Si usa come bobina secondaria di un trasformatore il cui primario è collegato alla rete a corrente alternata. Produce correnti fortissime in un circuito a resistenza molto bassa: ponendo lamierini tra i morsetti si possono fare dimostrazioni di saldatura a punti."]],
 f:"<div class='f'>V₂ / V₁ = N₂ / N₁ &nbsp;, &nbsp; I₂ / I₁ = N₁ / N₂</div><div class='f'>P = R · I²</div>Poche spire al secondario: tensione bassa e corrente molto elevata."},
{n:3,t:"Scala di Cross",v:"",sim:"",
 m:"Collezione: fisica · Sezione: elettricità · 32 × 30 × 14,3 cm · Materiali: vetro, ottone, rame, legno, gomma, ferro · Stato: buono",
 s:[["Descrizione","Dal nome del fisico Charles Robert Cross (1848–1921), che lo propose a fine Ottocento. Sei tubi a vuoto di vetro, di uguale lunghezza, sono disposti in verticale su un telaio di legno, ciascuno con un elettrodo a ogni estremità. Il vuoto è diverso in ogni tubo: 15, 10, 6, 3, 0,14 e 0,03 mm di Hg."],["Funzione","Collegando gli elettrodi di un tubo a un generatore di alta tensione si osservano scariche diverse in base al grado di vuoto. Il gas si ionizza: nel tubo a pressione più bassa compare la fluorescenza verde pallido dei raggi catodici, in quello a pressione più alta una scarica a bagliore."]],
 f:"<div class='f'>λ = k<sub>B</sub> T / (√2 π d² p)</div>Il libero cammino medio λ cresce al calare della pressione p: gli elettroni accelerano di più prima di urtare e la scarica cambia aspetto."},
{n:6,t:"Regolatore centrifugo di Watt",v:"",sim:"simulatore_regolatore_centrifugo_di_watt%20(2).html",
 m:"Collezione: fisica · Sezione: meccanica",
 s:[["Descrizione","Dispositivo meccanico per mantenere costante la velocità delle macchine a vapore, qui montato sull’apparecchio di rotazione. Un albero verticale porta un parallelogramma articolato collegato in basso a un “collare” che scorre lungo l’albero. Alle estremità del parallelogramma sono saldate due sfere d’acciaio di uguale massa: al crescere della velocità si allontanano dal centro per effetto della forza centrifuga e sollevano il collare, che regola la valvola del vapore."],["Funzione","Riduce la potenza del motore se la velocità è troppo alta e la aumenta se è troppo bassa: uno dei primi esempi di controllo automatico, con retroazione negativa. Dalla seconda metà del Novecento è stato sostituito da sensori elettronici e microprocessori."]],
 f:"<div class='f'>F<sub>c</sub> = m ω² r</div><div class='f'>ω² = g / (L cos θ)</div>Più ω è grande, più l’angolo θ delle sfere aumenta e il collare sale."},
{n:34,t:"Piano inclinato in metallo",v:"",sim:"simulatore_piano_inclinato.html",
 m:"Collezione: fisica · Sezione: meccanica · 61 × 59 × 22,2 cm · Materiale: metallo · Stato: ottimo",
 s:[["Descrizione","Robusta struttura metallica su base con guide, supporti e dispositivi di regolazione. Un elemento graduato, disposto obliquamente, permette di cambiare l’inclinazione. In alto c’è una carrucola con un filo collegato a piattelli sospesi, per applicare e variare i carichi. Le scale graduate danno la posizione dei carichi."],["Modalità d’uso","Si regola e si fissa l’inclinazione, si pongono sul piano i corpi da studiare, collegandoli al filo che passa sulla carrucola. Aggiungendo pesi ai piattelli si varia la forza applicata; dalle scale si leggono l’angolo e la posizione dei carichi. Si verificano così le condizioni di equilibrio tra forze, pesi, distanze e momenti."]],
 f:"<div class='f'>F<sub>∥</sub> = m g sin θ &nbsp;, &nbsp; F<sub>⊥</sub> = m g cos θ</div><div class='f'>M = F · b &nbsp; (momento = forza × braccio)</div>All’equilibrio la forza applicata dal filo bilancia la componente del peso lungo il piano."},
{n:47,t:"Cuneo",v:"Utv91qkBC6M",sim:"simulazione_interattiva_esperimento_del_cuneo%20(2).html",
 m:"Collezione: fisica · Sezione: meccanica e misure · Materiali: legno, metallo · Stato: buono",
 s:[["Descrizione","Corpo prismatico di legno a sezione triangolare. Lo strumento è citato nella Meccanica di Erone, matematico di Alessandria tra il III e il I secolo a.C. L’apparato è un prisma di legno inserito fra due rulli ad assi paralleli, con parti meccaniche molto scorrevoli."],["Funzione","Serve a fendere un corpo e separarne le parti. Si può schematizzare come due piani inclinati uniti per la base: più è piccolo l’angolo fra le facce laterali, minore è la forza necessaria per la fenditura."],["Modalità d’uso","Si posiziona il cuneo fra i due rulli da separare e si applica una resistenza sui rulli. La potenza si esercita sul prisma con un cordoncino e una puleggia, per analizzare le condizioni di equilibrio."]],
 f:"<div class='f'>F<sub>laterale</sub> = F / (2 tan(α/2))</div>Con α piccolo la forza laterale è molto maggiore di quella applicata: vantaggio meccanico del cuneo."},
{n:4,t:"Modello asse della ruota",v:"",sim:"",
 m:"Data: circa 1970 · Collezione: fisica · Sezione: meccanica · 24 × 15 × 11 cm · Materiale: legno · Stato: buono",
 s:[["Descrizione","Macchina semplice formata da un cilindro fissato rigidamente a una ruota, girevoli attorno a un asse comune fisso. È sempre vantaggiosa. Le sue applicazioni pratiche sono il verricello e l’argano, che permettono di sollevare o trascinare grandi pesi anche con la sola forza manuale."],["Equilibrio","Le due forze, motrice F<sub>m</sub> e resistente F<sub>r</sub>, agiscono con funi sulla ruota e sul cilindro. L’equilibrio si ha quando i due momenti sono uguali; poiché il raggio C del cilindro è minore del raggio R della ruota, la macchina è vantaggiosa."],["Verricello","Ha un tamburo rotante che avvolge la fune del carico; un ingranaggio moltiplica la forza (manovella o motore). Esempi: pignone-corona, vite senza fine, sistema epicicloidale. È una macchina molto antica."]],
 f:"<div class='f'>F<sub>m</sub> · R = F<sub>r</sub> · C</div><div class='f'>F<sub>m</sub> / F<sub>r</sub> = C / R</div>Il vantaggio meccanico è il rapporto R / C."},
{n:8,t:"Specchi sferici",v:"",sim:"",
 m:"Collezione: fisica · Sezione: ottica · 20 × 20 × 40 cm · Materiali: metallo, plastica, vetro · Stato: buono",
 s:[["Descrizione","Specchio concavo e specchio convesso, con montatura metallica orientabile in ogni senso e fissata su piede. Gli specchi, di 20 cm di diametro, sono lavorati otticamente da lastra di vetro e fortemente argentati. Distanza focale: 50 cm."],["Funzione","Adatti alle esperienze comuni di ottica: caustica di riflessione, proprietà del fuoco e del centro di curvatura, immagini reali, aberrazione sferica e astigmatismo."],["Immagini","Specchiandosi nello specchio concavo si vedono due immagini. Se il soggetto è più vicino del fuoco, l’immagine è ingrandita; se è oltre il fuoco, è capovolta e rimpicciolita."]],
 f:"<div class='f'>1/p + 1/q = 1/f = 2/R</div><div class='f'>G = − q / p</div>Con f = 50 cm: per p &lt; f l’immagine è virtuale e ingrandita; per p &gt; f è reale e capovolta. I raggi paralleli all’asse convergono nel fuoco."},
{n:50,t:"Prisma ad acqua",v:"OvEKQsAa8J0",sim:"",
 m:"Costruttore: anonimo · Europa · XX secolo · Collezione: fisica · Sezione: ottica · Altezza indicativa 15–25 cm · Materiali: vetro, ottone, leghe metalliche · Stato: discreto/buono",
 s:[["Descrizione","Apparecchio ottico formato da un prisma cavo con lastre di vetro piano montate e sigillate su una montatura di ottone o metallo. La cavità interna accoglie liquidi trasparenti."],["Funzione","Permetteva di studiare rifrazione, deviazione e dispersione della luce attraverso i liquidi e di confrontare il potere rifrangente dell’acqua con quello dei prismi di vetro massiccio."],["Modalità d’uso","Si riempie d’acqua distillata o di altri liquidi e si fa incidere un fascio di luce su una faccia. Variando l’angolo di incidenza si osserva la scomposizione della luce bianca nello spettro e si può ricavare l’indice di rifrazione del liquido."]],
 f:"<div class='f'>n<sub>1</sub> sin θ<sub>1</sub> = n<sub>2</sub> sin θ<sub>2</sub> &nbsp; (legge di Snell)</div><div class='f'>n = sin((A + δ<sub>min</sub>)/2) / sin(A/2)</div>L’indice n dipende dal colore (dispersione): per questo la luce bianca si scompone nell’arcobaleno."},
{n:52,t:"Specchi ustori",v:"W6N1-qdk4sQ",sim:"esperimento_specchi_parabolici.html",
 m:"Collezione: fisica · Sezione: ottica · Diametro dello specchio: circa 27 cm · Materiali: supporto rigido con superficie riflettente metallica o rivestita (composizione da accertare) · Stato: buono",
 s:[["Descrizione","Coppia di specchi parabolici usati nelle esperienze didattiche di ottica geometrica e di riflessione della luce. La superficie riflettente ha profilo parabolico: i raggi paralleli all’asse ottico vengono riflessi e convergono nel fuoco."],["Funzione","Se una sorgente luminosa è posta nel fuoco, i raggi riflessi escono paralleli all’asse ottico. Con due specchi si realizzano esperimenti per osservare la convergenza dei raggi, la posizione del fuoco e il legame fra forma della superficie e percorso della luce."]],
 f:"<div class='f'>y = x² / (4f)</div><div class='f'>f = R / 2</div>Nella parabola tutti i raggi paralleli all’asse passano per il fuoco, senza l’aberrazione sferica degli specchi sferici: per questo, concentrando la luce solare, sono detti “ustori”."},
{n:5,t:"La macchina di Wimshurst",v:"",sim:"simulazione_interattiva_macchina_di_wimshurst.html",
 m:"Costruttore: James Wimshurst · 1883 · Collezione: fisica · Sezione: elettricità · 17 × 54 × 30 cm · Materiali: metallo, legno, vetro, acciaio · Stato: buono",
 s:[["Descrizione","Sfrutta l’induzione elettrostatica per accumulare carica. È formata da due dischi isolanti con settori conduttori che ruotano in senso opposto, azionati da un’unica manovella; due contatti, due insiemi di punte, due bottiglie di Leida (condensatori) e due sfere per la scintilla (spinterometro)."],["Funzione","Genera alta tensione continua stabile, regolabile. È stata usata per produrre raggi catodici, raggi X e per altri impieghi di laboratorio."],["Modalità d’uso","Girando i dischi, i settori si polarizzano per induzione e le cariche passano agli elettrodi. Il verso di rotazione deve restare sempre lo stesso: invertendolo gli elettrodi si scaricherebbero invece di caricarsi."]],
 f:"<div class='f'>Q = C · V</div><div class='f'>E = ½ C V²</div>La scintilla scocca quando V supera la rigidità dielettrica dell’aria (circa 3 kV/mm)."},
{n:13,t:"Tavolino di Varignon",v:"",sim:"simulazione_tavolino_di_varignon.html",
 m:"Collezione: fisica · Sezione: meccanica · 20 × 15 × 4 cm · Materiali: metallo, plastica · Stato: buono",
 s:[["Descrizione","Un tavolino circolare di metallo con tre morsetti a carrucola. Sulle gole passano tre fili flessibili legati a un anello leggero; all’altro capo dei fili si appendono pesi variabili: due rappresentano le forze componenti e uno la risultante. Un grafico fissa la composizione delle forze sul tavolo."],["Funzione","L’anello, tenuto al centro da uno spillo, è il corpo sollecitato. Quando resta al centro anche dopo aver tolto lo spillo, le tre forze sono in equilibrio."]],
 f:"<div class='f'>F<sub>1</sub> + F<sub>2</sub> + F<sub>3</sub> = 0 &nbsp; (vettori)</div><div class='f'>R² = F<sub>1</sub>² + F<sub>2</sub>² + 2F<sub>1</sub>F<sub>2</sub> cos α</div>La risultante di due forze è uguale e opposta alla terza."},
{n:15,t:"Pendolo di Waltenhofen",v:"",sim:"pendolo_di_waltenhofen_simulazione_interattiva.html",
 m:"Costruttore: Adalbert von Waltenhofen · 1855 · Collezione: fisica · Sezione: elettromagnetismo · Altezza 36,5 cm, lunghezza 20 cm, larghezza 11 cm · Materiali: legno, ottone, rame, ferro, acciaio · Stato: buono",
 s:[["Descrizione","Su una base di legno sono fissate due bobine con un pendolo (telaio d’acciaio) che regge un conduttore, di solito di rame. Sotto ci sono due elettromagneti il cui campo si regola con la corrente continua."],["Funzione","Senza campo il pendolo oscilla libero; con il campo si ferma quasi subito. Nel conduttore in moto si inducono correnti che, per la legge di Lenz, frenano il movimento: l’energia potenziale si trasforma in calore per effetto Joule."],["Variante","Con un conduttore “a pettine”, cioè con fenditure, le correnti di Foucault sono molto più piccole e il moto dura molto più a lungo."]],
 f:"<div class='f'>ε = − dΦ/dt &nbsp; (Faraday–Neumann–Lenz)</div><div class='f'>P = ε² / R</div>Le correnti parassite generano una forza frenante opposta alla velocità."},
{n:16,t:"Rocchetto di Ruhmkorff",v:"",sim:"",
 m:"Costruttore: Heinrich Daniel Ruhmkorff · 1851 · Collezione: fisica · Sezione: elettromagnetismo · Altezza 19 cm, larghezza 20,5 cm, lunghezza 40 cm · Materiali: legno, ottone, ferro, gommalacca, rame · Stato: mediocre",
 s:[["Descrizione","Un nucleo ferromagnetico di lastre di ferro porta due bobine: il circuito primario, alimentato da una batteria, con un martelletto che interrompe il contatto, e il secondario, con molte più spire. Il secondario ha due terminali collegabili a uno spinterometro."],["Modalità d’uso","Con l’induzione elettromagnetica trasforma una tensione continua debole in tensioni alternate molto elevate. Il martelletto apre e chiude il circuito; a ogni variazione di flusso nel secondario si induce una forza elettromotrice. Per oltre mezzo secolo è stato l’unico dispositivo capace di generare tensioni elevate, fondamentale per le onde hertziane e per le scariche nei gas rarefatti."]],
 f:"<div class='f'>ε<sub>2</sub> = − N<sub>2</sub> dΦ/dt</div><div class='f'>V<sub>2</sub> / V<sub>1</sub> ≈ N<sub>2</sub> / N<sub>1</sub></div>Più spire ha il secondario, più alta è la tensione indotta."},
{n:17,t:"Tubi comunicanti per la variazione di carico nei liquidi in moto",v:"",sim:"apparecchio_storico_di_bernoulli_con_4_tubi.html",
 m:"Costruttore: Officine Galileo · Firenze · secondo quarto del XX secolo · Collezione: fisica · Sezione: meccanica · Materiali: metallo, vetro · Stato: buono",
 s:[["Descrizione","Apparecchio idrodinamico con condotto orizzontale, 4 tubi piezometrici verticali di vetro e una spira di resistenza. Facendo scorrere l’acqua con livello costante nel serbatoio, i livelli nei tubi indicano la differenza fra pressione atmosferica e pressione dinamica nei vari punti: si dispongono lungo una retta inclinata."],["Funzione","Per il teorema di Bernoulli la pressione dinamica di un fluido in moto è tanto minore quanto maggiore è la velocità. La pressione statica, invece, è la stessa in tutti i punti: chiudendo le estremità l’acqua si dispone come nei vasi comunicanti."],["Modalità d’uso","Le perdite di carico dovute a cambi di sezione, di direzione e agli attriti si osservano dai livelli piezometrici nei singoli punti."]],
 f:"<div class='f'>p + ½ρv² + ρgh = costante</div><div class='f'>A<sub>1</sub> v<sub>1</sub> = A<sub>2</sub> v<sub>2</sub></div>Dove la sezione si restringe la velocità cresce e la pressione cala."},
{n:18,t:"Modello di vasi comunicanti",v:"",sim:"simulazione_vasi_comunicanti_e_stevino%20(1).html",
 m:"Collezione: fisica · Sezione: fluidostatica · 40 × 19 × 10 cm · Materiale: vetro · Stato: buono",
 s:[["Descrizione","Il principio dei vasi comunicanti è legato alla legge di Stevino (Simon Stevin, 1586): in contenitori collegati il liquido raggiunge lo stesso livello in tutti, perché la pressione alla stessa profondità è uguale. Oggi si sfrutta in impianti idrici, canali artificiali, strumenti di misura e sistemi di regolazione termica."]],
 f:"<div class='f'>p = p₀ + ρ g h &nbsp; (legge di Stevino)</div>A parità di profondità la pressione è uguale: per questo i livelli si allineano."}
