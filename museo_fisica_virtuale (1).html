 const gl=new THREE.Mesh(new THREE.CylinderGeometry(.55*s,.55*s,1.1*s,16,1,true),new THREE.MeshBasicMaterial({color:0xaad4ff,transparent:true,opacity:.12,side:2}));gl.position.y=1.55;
